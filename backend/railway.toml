# Railway: build this directory's Dockerfile (not a Node guess from the repo
# root). The service's Root Directory must be set to `backend`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300          # first boot runs migrations, and the seed if enabled
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
