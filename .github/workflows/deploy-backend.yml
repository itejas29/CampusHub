# Deploys the API to Railway when backend code reaches master.
#
# Railway's own GitHub integration can't be used: the repository is connected
# to a different Railway account from the one hosting the service. Deploying
# from here with a project token sidesteps that, and only deploys code whose
# tests pass.
#
# Needs one repository secret, RAILWAY_TOKEN — a *project* token from Railway
# (project → Settings → Tokens), scoped to the production environment.
name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# Never run two deploys at once; let a running one finish.
concurrency:
  group: railway-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The suite is database-free or in-memory SQLite — no Postgres needed.
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # The CampusHub service in the sparkling-enjoyment project.
      RAILWAY_SERVICE_ID: f5ed39ac-7984-47ae-9ede-a89c8645d94b
    steps:
      - uses: actions/checkout@v4
      - name: Check the token is configured
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Add a Railway project token as the RAILWAY_TOKEN repository secret."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @railway/cli@5.8.0
      # Upload the whole repository: the service's Root Directory is set to
      # `backend` in Railway, and Railway descends into it to build
      # backend/Dockerfile. (Uploading only backend/ fails — Railway then looks
      # for backend/backend.) --ci streams the build and fails this job if the
      # deploy fails.
      - run: railway up --service "$RAILWAY_SERVICE_ID" --ci
